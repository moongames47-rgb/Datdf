<script>
const A=[{"q": "Сапаны қамтамасыз ету (QA) қандай процесс?", "o": [["Бұл алдын алуға бағытталған процесс.", 1], ["Дайын өнімді сатуға бағытталған процесс.", 0], ["Тек интерфейсті безендіру процесі.", 0], ["Деректерді архивтеу процесі.", 0], ["Серверді басқару процесі.", 0]]}, {"q": "QA жүйесі бағдарламаны әзірлеудің қандай кезеңдерінде сапа стандарттарын сақтауға бағытталған?", "o": [["QA жүйесі бағдарламаны әзірлеудің барлық кезеңдерінде (жоспарлау, талаптарды талдау, дизайн, кодтау, тестілеу) сапа стандарттарын сақтауға, процестерді жақсартуға және қателердің пайда болуына жол бермеуге бағытталған.", 1], ["QA тек бағдарлама дайын болғаннан кейін ғана қолданылады.", 0], ["QA тек сервер іске қосылған кезде орындалады.", 0], ["QA тек пайдаланушы интерфейсінің түсін таңдауға арналған.", 0], ["QA тек деректерді резервтік көшірумен шектеледі.", 0]]}, {"q": "Тестілеу (Testing) қандай сәйкессіздіктерді анықтауға бағытталған?", "o": [["Бұл жүйенің жұмысын тексеруге және күтілетін нәтижелер мен нақты нәтижелер арасындағы сәйкессіздіктерді (қателерді, багтарды) анықтауға бағытталған практикалық әрекет.", 1], ["Кодтың архитектурасын жобалауға бағытталған әрекет.", 0], ["Қызметкерлердің жұмыс кестесін тексеру әрекеті.", 0], ["Бағдарламаның интерфейсін безендіру әрекеті.", 0], ["Сервердің физикалық орналасуын анықтау әрекеті.", 0]]}, {"q": "Сапа (Quality) дегеніміз не?", "o": [["Өнімнің барлық талаптар мен күтілетін стандарттарға сай келу дәрежесі.", 1], ["Бағдарламадағы функциялар саны.", 0], ["Кодтың жазылған жолдарының жалпы саны.", 0], ["Сервердің физикалық өлшемі.", 0], ["Пайдаланушылардың тіркелу саны.", 0]]}, {"q": "Ақау (Bug / Defect) дегеніміз не?", "o": [["Бағдарламаның күтілгендей жұмыс істемеуі немесе спецификациядан ауытқуы.", 1], ["Бағдарламаның барлық талаптарға сай жұмыс істеуі.", 0], ["Жаңа функцияның жоспарға сай қосылуы.", 0], ["Кодтың түсінікті әрі ықшам жазылуы.", 0], ["Тестілеу жоспарының атауы.", 0]]}, {"q": "Верификация (Verification) нені тексереді?", "o": [["«Біз өнімді дұрыс жасап жатырмыз ба?» (талаптарға сәйкестігін тексеру).", 1], ["«Біз дұрыс өнімді жасадық па?» (пайдаланушының қажеттілігін қанағаттандыруын тексеру).", 0], ["Сервердің жүктемесін өлшеу.", 0], ["Кодтың орындалу жылдамдығын арттыру.", 0], ["Интерфейс түсін таңдау.", 0]]}, {"q": "Валидация (Validation) нені тексереді?", "o": [["«Біз дұрыс өнімді жасадық па?» (пайдаланушының қажеттілігін қанағаттандыруын тексеру).", 1], ["«Біз өнімді дұрыс жасап жатырмыз ба?» (талаптарға сәйкестігін тексеру).", 0], ["Кодтағы барлық операторларды санау.", 0], ["Сервердің IP-мекенжайын анықтау.", 0], ["Бағдарламалау тілін ауыстыру.", 0]]}, {"q": "Тестілеудің негізгі түрлеріне нелер жатады?", "o": [["Тестілеудің негізгі түрлеріне қолмен тестілеу (Manual) және автоматтандырылған тестілеу (Automation) жатады.", 1], ["Тестілеудің негізгі түрлеріне жобалау және сату жатады.", 0], ["Тестілеудің негізгі түрлеріне архивтеу және көшіру жатады.", 0], ["Тестілеудің негізгі түрлеріне кодтау және компиляциялау жатады.", 0], ["Тестілеудің негізгі түрлеріне дизайн және маркетинг жатады.", 0]]}, {"q": "Кодты шолу (Code Review) дегеніміз не?", "o": [["Кодты шолу (Code Review) — бұл бағдарламашылардың бірінің кодын екіншісі (немесе бірнеше әріптесі) өндіріске (production) жібермес бұрын жүйелі түрде қарап шығып, қателерді, стильдік ауытқуларды және әлсіз тұстарды анықтау процесі.", 1], ["Кодты шолу — бағдарламаны соңғы пайдаланушыға сату процесі.", 0], ["Кодты шолу — деректер базасын автоматты түрде көшіру процесі.", 0], ["Кодты шолу — компьютердің аппараттық бөлігін тексеру процесі.", 0], ["Кодты шолу — веб-беттің түсін өзгерту процесі.", 0]]}, {"q": "Code Review мақсаттарының бірі қандай?", "o": [["Кодтың сапасын арттыру және архитектуралық қателерді ерте кезеңде жою.", 1], ["Пайдаланушылар санын шектеу және серверді өшіру.", 0], ["Бағдарламаның түсін өзгерту және суреттерді өңдеу.", 0], ["Деректерді архивтеу және файлдарды көшіру.", 0], ["Қызметкерлердің жұмыс уақытын есептеу.", 0]]}, {"q": "Code Review кезінде Knowledge sharing нені қамтамасыз етеді?", "o": [["Код базасын команда мүшелерінің бірлесіп түсінуін қамтамасыз ету (Knowledge sharing).", 1], ["Кодты тек бір әзірлеушінің түсінуін қамтамасыз ету.", 0], ["Серверге кіру құқықтарын автоматты түрде жою.", 0], ["Пайдаланушы интерфейсінің аудармасын жасау.", 0], ["Бағдарламаны дүкенге жариялау.", 0]]}, {"q": "Code Review кезінде қандай стандарттар сақталады?", "o": [["Бағдарламалаудың жалпы стандарттары мен стильдерін (Code Style) сақтау.", 1], ["Компьютер құрылғыларының бағаларын сақтау.", 0], ["Пайдаланушылардың жеке кестесін сақтау.", 0], ["Желілік кабельдердің ұзындығын сақтау.", 0], ["Сервер бөлмесінің температурасын сақтау.", 0]]}, {"q": "Pull Request / Merge Request шолуы қай платформаларда кең таралған?", "o": [["Pull Request / Merge Request шолуы: Заманауи Git платформаларында (GitHub, GitLab, Bitbucket) ең кең таралған әдіс.", 1], ["Microsoft Word, Excel және PowerPoint платформаларында.", 0], ["Photoshop, Illustrator және Paint бағдарламаларында.", 0], ["Chrome, Firefox және Safari браузерлерінде.", 0], ["Windows, Linux және Android операциялық жүйелерінде.", 0]]}, {"q": "Жұппен бағдарламалау (Pair Programming) кезінде Driver не істейді?", "o": [["біреуі код жазады (Driver)", 1], ["Біреуі серверді өшіреді (Driver).", 0], ["Біреуі тест нәтижесін жариялайды (Driver).", 0], ["Біреуі жобаны қаржыландырады (Driver).", 0], ["Біреуі деректер базасын көшіреді (Driver).", 0]]}, {"q": "Жұппен бағдарламалау (Pair Programming) кезінде Navigator не істейді?", "o": [["екіншісі бір мезгілде оны бақылап, тексереді (Navigator).", 1], ["Екіншісі бағдарламаны сатады (Navigator).", 0], ["Екіншісі серверді өшіреді (Navigator).", 0], ["Екіншісі деректер базасын көшіреді (Navigator).", 0], ["Екіншісі интерфейс түсін таңдайды (Navigator).", 0]]}, {"q": "Сапалы Code Review кезінде нелер қатаң түрде тексеріледі?", "o": [["Сапалы Code Review кезінде тек логикалық қателер емес, сонымен қатар қауіпсіздік о
